[workspace]
resolver = "3"

members = [
    "libs/*",
    "gui",
    "tools/bot_train",
]

# Games in tests are slow without optimization.
[profile.test]
opt-level = 2

[profile.release]
# Speed over size: the bot runs and trains neural networks in the browser.
opt-level = 3
lto = true
codegen-units = 1
